server.port=8080
spring.application.name=hotel-management-cassandra

# Tắt Auto-Configuration mặc định của Spring Boot (để không tự động kết nối localhost:9042)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration,org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration


# ============================================================
# CẤU HÌNH KẾT NỐI DATASTAX ASTRA DB (APACHE CASSANDRA)
# ============================================================
# Đường dẫn tương đối hoặc tuyệt đối tới file secure-connect-bundle.zip
# Bạn đặt file zip tải từ Astra DB vào thư mục astra-creds/
astra.db.secure-connect-bundle-path=astra-creds/secure-connect-hotel-db.zip

# Astra DB Application Token (Client Secret bắt đầu bằng AstraCS:...)
# Tạo tại: Astra DB -> Settings -> Token Management -> Role: Database Administrator -> Generate Token
astra.db.token=${ASTRA_DB_TOKEN}

# Keyspace name trong Astra DB
astra.db.keyspace=qlks

# Bật/Tắt Mock Data Fallback khi chưa nạp file bundle zip (tiện cho demo offline)
# true: nếu không kết nối được Astra DB sẽ dùng Mock In-Memory Data để giao diện vẫn chạy mượt mà
# false: yêu cầu bắt buộc kết nối thành công tới Astra DB
astra.db.enable-fallback=true

# Định dạng hiển thị JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Ho_Chi_Minh
